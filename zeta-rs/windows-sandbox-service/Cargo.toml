[package]
name = "zeta-windows-sandbox-service"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "zeta_windows_sandbox_service"
path = "src/lib.rs"

[[bin]]
name = "zeta-windows-sandbox-service"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
zeta-windows-sandbox = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[lints.rust]
# The service lifecycle, authenticated pipe, token, and pinned-path boundary require Win32 FFI.
unsafe_code = "allow"
