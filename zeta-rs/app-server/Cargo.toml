zeta-collaboration = { workspace = true }
zeta-code-index = { workspace = true }
zeta-code-index-cloud = { workspace = true }
zeta-code-index-semantic = { workspace = true }
zeta-code-retrieval = { workspace = true }
zeta-config = { workspace = true }
zeta-core = { workspace = true }
zeta-client = { workspace = true }
zeta-diff = { workspace = true }
zeta-extensions = { workspace = true }
zeta-extension-api = { workspace = true }
zeta-file-system = { workspace = true }
