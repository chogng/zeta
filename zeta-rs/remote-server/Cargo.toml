[package]
name = "zeta-remote-server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "zeta-remote-server"
path = "src/main.rs"

[lib]
doctest = false
name = "zeta_remote_server"
path = "src/lib.rs"

[dependencies]
zeta-utils-home-dir = { workspace = true }
zeta-install-context = { workspace = true }
serde_json = { workspace = true }
zeta-package-store = { workspace = true }
arg0 = { workspace = true }
process-hardening = { workspace = true }
build-info = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["process"] }
sha2 = { workspace = true }
zeta-app-server = { workspace = true }
zeta-app-server-protocol = { workspace = true }

[dev-dependencies]
zeta-file-access = { workspace = true }
zeta-fast-regex-search = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
zeta-app-server-client = { workspace = true }

[lints]
workspace = true
