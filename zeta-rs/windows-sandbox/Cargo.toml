[package]
name = "zeta-windows-sandbox"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "windows_sandbox"
doctest = false

[[bin]]
name = "zeta-windows-sandbox"
path = "src/main.rs"

[dependencies]
zeta-sandboxing = { workspace = true }
zeta-file-access = { workspace = true }
zeta-install-context = { workspace = true }
zeta-utils-pty = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
getrandom = "0.2"
socket2 = "0.6"
winreg = "0.55"
wxc_common = { path = "../vendor/mxc/core/wxc_common" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Rpc", "Win32_System_StationsAndDesktops", "Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = { workspace = true }
zeta-tool-executor = { workspace = true }
zeta-async-utils = { workspace = true }
network-proxy = { workspace = true, features = ["server"] }

# This platform owner performs the Windows account, token, ACL and process FFI.
[lints.rust]
unsafe_code = "allow"
