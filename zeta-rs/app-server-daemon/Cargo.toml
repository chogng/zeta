[package]
name = "zeta-app-server-daemon"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "zeta-app-server-daemon"
path = "src/main.rs"

[lib]
doctest = false
name = "zeta_app_server_daemon"
path = "src/lib.rs"

[dependencies]
dunce = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
signal-hook = { workspace = true }
zeta-app-server = { workspace = true }
zeta-app-server-client = { workspace = true }
zeta-app-server-protocol = { workspace = true }
zeta-uds = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
