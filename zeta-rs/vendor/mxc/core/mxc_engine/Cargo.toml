[package]
name = "mxc_engine"
version = "0.8.0"
edition = "2021"
license = "MIT"
description = "MXC execution engine: backend dispatch, host probing, and config building shared by the public SDK and the executor binaries."

[lib]
name = "mxc_engine"
path = "src/lib.rs"

[dependencies]
wxc_common = { "path" = "../wxc_common" }
serde = { "version" = "1", "features" = ["derive"] }
serde_json = { "version" = "1" }
nanvix_runner = { "git" = "https://github.com/microsoft/mxc", "rev" = "6cd3d58f05d3447e67109cfb75e042803b843ca4", "optional" = true }

[target."cfg(target_arch = \"x86_64\")".dependencies]
hyperlight_common = { "git" = "https://github.com/microsoft/mxc", "rev" = "6cd3d58f05d3447e67109cfb75e042803b843ca4", "optional" = true }

[target."cfg(target_os = \"windows\")".dependencies]
appcontainer_common = { "path" = "../../backends/appcontainer/common" }
windows_sandbox_lifecycle = { "git" = "https://github.com/microsoft/mxc", "rev" = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
isolation_session_common = { "git" = "https://github.com/microsoft/mxc", "rev" = "6cd3d58f05d3447e67109cfb75e042803b843ca4", "optional" = true }
isolation_session_bindings = { "git" = "https://github.com/microsoft/mxc", "rev" = "6cd3d58f05d3447e67109cfb75e042803b843ca4", "optional" = true }
wslc_common = { "git" = "https://github.com/microsoft/mxc", "rev" = "6cd3d58f05d3447e67109cfb75e042803b843ca4", "optional" = true }
plm = { "git" = "https://github.com/microsoft/mxc", "rev" = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
learning_mode_core = { "git" = "https://github.com/microsoft/mxc", "rev" = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
windows = { "version" = "0.62", "features" = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_WindowsFirewall", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

[target."cfg(target_os = \"linux\")".dependencies]
bwrap_common = { "path" = "../../backends/bubblewrap/common" }
lxc_common = { "git" = "https://github.com/microsoft/mxc", "rev" = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }

[target."cfg(target_os = \"macos\")".dependencies]
seatbelt_common = { "path" = "../../backends/seatbelt/common" }

[features]
default = []
microvm = ["dep:nanvix_runner"]
wslc = ["dep:wslc_common", "wslc_common/link-wslcsdk"]
hyperlight = ["dep:hyperlight_common", "hyperlight_common/hyperlight"]
isolation_session = ["dep:isolation_session_bindings", "dep:isolation_session_common"]
tier2_bfs = ["appcontainer_common/tier2_bfs"]
