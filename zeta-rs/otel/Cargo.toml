[package]
name = "zeta-otel"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "zeta_otel"
path = "src/lib.rs"

[features]
default = []
mock = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:serde",
    "dep:zeta-client",
    "dep:zeta-http-client",
]

[dependencies]
opentelemetry = { workspace = true, features = ["metrics", "trace"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["metrics", "testing", "trace"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
zeta-client = { workspace = true, optional = true }
zeta-http-client = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
