[package]
name = "zeta-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "zeta_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
zeta-async-utils = { workspace = true }
zeta-attachments = { workspace = true }
zeta-context-engine = { workspace = true }
zeta-extension-api = { workspace = true }
zeta-history = { workspace = true }
zeta-action-policy = { workspace = true }
zeta-prompts = { workspace = true }
zeta-protocol = { workspace = true }
zeta-sandboxing = { workspace = true }
zeta-session-store = { workspace = true }
zeta-thread-store = { workspace = true }
zeta-utils-image = { workspace = true }

[dev-dependencies]
image = { workspace = true, features = ["png"] }
zeta-execpolicy = { workspace = true }

[lints]
workspace = true
