[package]
name = "zeta-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
code-mode = ["dep:zeta-code-mode", "dep:zeta-code-mode-protocol"]

[lib]
doctest = false
name = "zeta_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
zeta-async-utils = { workspace = true }
zeta-attachments = { workspace = true }
zeta-context-engine = { workspace = true }
zeta-code-mode = { workspace = true, optional = true }
zeta-code-mode-protocol = { workspace = true, optional = true }
zeta-extension-api = { workspace = true }
zeta-history = { workspace = true }
zeta-action-policy = { workspace = true }
zeta-agent-environment = { workspace = true }
zeta-prompts = { workspace = true }
zeta-protocol = { workspace = true }
zeta-sandboxing = { workspace = true }
zeta-session-store = { workspace = true }
zeta-thread-store = { workspace = true }
zeta-utils-image = { workspace = true }
zeta-utils-stream-parser = { workspace = true }

[dev-dependencies]
image = { workspace = true, features = ["png"] }
zeta-execpolicy = { workspace = true }

[lints]
workspace = true
