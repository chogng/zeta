[package]
name = "zeta-file-identity"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "zeta_file_identity"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints.rust]
# Win32 exposes stable file identity and link count only through a narrow handle FFI.
unsafe_code = "allow"
