[package]
name = "zeta-fast-regex-search"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "zeta_fast_regex_search"
path = "src/lib.rs"

[dependencies]
globset = { workspace = true }
ignore = { workspace = true }
memmap2 = { workspace = true }
regex = { workspace = true }
regex-syntax = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeta-file-access = { workspace = true }
zeta-immutable-generation-store = { workspace = true }
zeta-uds = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bench]]
name = "fast_regex_vs_rg"
harness = false

[lints.rust]
# This crate is the narrow Fast Regex mmap boundary. The only unsafe operation maps a published
# immutable lookup file while retaining its generation lease.
unsafe_code = "allow"
