[profile.dev]
# Keep line tables and backtraces without generating full variable debug information.
debug = "limited"

[profile.dev-small]
inherits = "dev"
opt-level = 0
debug = "none"
strip = "symbols"

[profile.ci-test]
# Reduce binary size and disk pressure in CI test builds.
inherits = "test"
opt-level = 0
debug = "limited"

[workspace.lints.rust]
unsafe_code = "forbid"
