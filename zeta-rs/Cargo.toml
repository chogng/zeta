[workspace]
members = [
    "app-server",
    "app-server-client",
    "app-server-protocol",
    "app-server-transport",
    "apply-patch",
    "async-utils",
    "auto-review",
    "bwrap",
    "cli",
    "config",
    "core",
    "secrets",
    "exec",
    "file-search",
    "file-system",
    "http-client",
    "linux-sandbox",
    "model-provider",
    "model-provider-config",
    "policy",
    "protocol",
    "rollout",
    "rollout-trace",
    "sandboxing",
    "session-store",
    "shell-command",
    "storage",
    "thread-store",
    "tools",
    "tui",
    "utils/pdf",
    "utils/pty",
    "utils/typst",
    "windows-sandbox-rs",
    "zeta-api",
    "zeta-client",
]
resolver = "3"

[workspace.package]
edition = "2024"
license-file = "../LICENSE"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
lazy_static = "1"
libc = "0.2"
log = "0.4"
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_7763", "thread_safe"] }
portable-pty = "0.9.0"
pretty_assertions = "1"
crossterm = "0.28.1"
ratatui = "0.29.0"
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
sha2 = "0.10"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
typst = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-pdf = "=0.15.1"
tokio = "1"
unicode-width = "0.2"
ureq = { version = "2.12", features = ["json", "native-certs"] }
zeroize = "1"
zeta-app-server = { path = "app-server" }
zeta-app-server-client = { path = "app-server-client" }
zeta-app-server-protocol = { path = "app-server-protocol" }
zeta-app-server-transport = { path = "app-server-transport" }
zeta-apply-patch = { path = "apply-patch" }
zeta-async-utils = { path = "async-utils" }
zeta-auto-review = { path = "auto-review" }
zeta-bwrap = { path = "bwrap" }
zeta-api = { path = "zeta-api" }
zeta-client = { path = "zeta-client" }
zeta-config = { path = "config" }
zeta-core = { path = "core" }
zeta-secrets = { path = "secrets" }
zeta-exec = { path = "exec" }
zeta-file-search = { path = "file-search" }
zeta-file-system = { path = "file-system" }
zeta-http-client = { path = "http-client" }
zeta-linux-sandbox = { path = "linux-sandbox" }
zeta-model-provider = { path = "model-provider" }
zeta-model-provider-config = { path = "model-provider-config" }
zeta-policy = { path = "policy" }
zeta-protocol = { path = "protocol" }
zeta-rollout = { path = "rollout" }
zeta-rollout-trace = { path = "rollout-trace" }
zeta-sandboxing = { path = "sandboxing" }
zeta-session-store = { path = "session-store" }
zeta-shell-command = { path = "shell-command" }
zeta-storage = { path = "storage" }
zeta-thread-store = { path = "thread-store" }
zeta-tools = { path = "tools" }
zeta-tui = { path = "tui" }
zeta-pdf = { path = "utils/pdf" }
zeta-utils-pty = { path = "utils/pty" }
zeta-typst = { path = "utils/typst" }
zeta-windows-sandbox = { path = "windows-sandbox-rs" }

[workspace.lints.rust]
unsafe_code = "forbid"
