[package]
name = "zui-demo"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "zui-demo"
path = "src/main.rs"

[features]
native = ["zui/wgpu"]

[[bin]]
name = "zui-native-demo"
path = "src/native_main.rs"
required-features = ["native"]

[dependencies]
zeta-ui-components = { workspace = true }
zui = { workspace = true, default-features = false }

[lints]
workspace = true
