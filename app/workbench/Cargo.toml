[package]
name = "zeta-workbench"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "zeta_workbench"
path = "lib.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
unicode-width = { workspace = true }
zeta-app-server-client = { workspace = true }
zeta-app-server-daemon = { workspace = true }
zeta-app-server-protocol = { workspace = true }
zeta-commands = { workspace = true }
zeta-diff = { workspace = true }
zeta-editor = { workspace = true }
zeta-editor-host = { workspace = true }
zeta-file-search = { workspace = true }
zeta-files = { workspace = true }
zeta-icons = { workspace = true }
zeta-input-classifier = { workspace = true }
zeta-install-context = { workspace = true }
zeta-keybinding = { workspace = true }
zeta-keybindings-host = { workspace = true }
zeta-lsp-manager = { workspace = true }
zeta-lsp-server-provider = { workspace = true }
zeta-protocol = { workspace = true }
zeta-remote = { workspace = true }
zeta-remote-connections = { workspace = true }
zeta-remote-host = { workspace = true }
zeta-session = { workspace = true }
zeta-settings = { workspace = true }
zeta-scm = { workspace = true }
zeta-server-host = { workspace = true }
zeta-slash-commands = { workspace = true }
zeta-terminal = { workspace = true }
zeta-terminal-workspace = { workspace = true }
zeta-text-file = { workspace = true }
zeta-theme = { workspace = true }
zeta-ui-components = { workspace = true }
zeta-ui-theme = { workspace = true }
zeta-utils-path = { workspace = true }
zeta-utils-pty = { workspace = true }
zeta-workbench-model = { workspace = true }
zui = { workspace = true, features = ["wgpu"] }

[lints]
workspace = true

[dev-dependencies]
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
zeta-diff = { workspace = true }
zeta-text-file = { workspace = true }
zeta-workspace = { workspace = true }
