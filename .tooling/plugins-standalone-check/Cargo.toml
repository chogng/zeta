[workspace]
members = ["."]
resolver = "3"

[package]
name = "zeta-plugins"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
doctest = false
name = "zeta_plugins"
path = "src/lib.rs"

[dependencies]
getrandom = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
