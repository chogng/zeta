[workspace]
resolver = "3"
members = ["core/mxc_engine", "core/wxc_common", "backends/appcontainer/common", "backends/bubblewrap/common", "backends/seatbelt/common"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
appcontainer_common = { path = "backends/appcontainer/common" }
base64 = "0.22"
bwrap_common = { path = "backends/bubblewrap/common" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cidr = "0.3.2"
clap = { version = "4", features = ["derive"] }
flatbuffers = "25"
getrandom = "0.2"
hyperlight_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
isolation_session_bindings = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
isolation_session_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
learning_mode_core = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
learning_mode_windows = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
libc = "0.2"
lxc_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
mxc_build_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
mxc_config_contract = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
mxc_engine = { path = "core/mxc_engine" }
mxc_pty = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
mxc_schema_support = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
mxc-sdk = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
mxc_telemetry = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
nanvix_runner = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
nix = { version = "0.29", features = ["fs", "mount", "sched", "signal", "net", "process", "user", "term"] }
process_security_environment_spec = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
plm = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
quick-xml = "0.41"
sandbox_spec = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
seatbelt_common = { path = "backends/seatbelt/common" }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "0.8"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracelogging = "1.2"
unicode-general-category = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
widestring = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_WindowsFirewall", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }
windows-core = "0.62"
windows_sandbox_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
windows_sandbox_lifecycle = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
winreg = "0.55"
wslc_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
wxc_common = { path = "core/wxc_common" }

[patch."https://github.com/microsoft/mxc"]
mxc_engine = { path = "core/mxc_engine" }
wxc_common = { path = "core/wxc_common" }
appcontainer_common = { path = "backends/appcontainer/common" }
bwrap_common = { path = "backends/bubblewrap/common" }
seatbelt_common = { path = "backends/seatbelt/common" }

[profile.dev]
debug = "limited"
incremental = true
opt-level = 1

[profile.test.package."*"]
opt-level = 1
