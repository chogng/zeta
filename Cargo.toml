[workspace.package]
edition = "2024"
license-file = "LICENSE"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
bm25 = "2.3.2"
bytemuck = { version = "1", features = ["derive"] }
cc = "1"
clap = "4"
cosmic-text = "0.19.0"
dunce = "1"
getrandom = "0.2"
glyphon = "0.12.0"
image = { version = "0.25.10", default-features = false }
ignore = "0.4"
lazy_static = "1"
libc = "0.2"
log = "0.4"
lsp-types = "0.97"
hf-chat-template = { version = "1.0.0", features = ["strftime"] }
# Recursive workspace watches must use FSEvents on macOS; kqueue holds one file
# descriptor per watched entry and exhausts the process limit on large workspaces.
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "4253de9faabb4e5c6d81d946a5e35a90f87347ee" }
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_7763", "thread_safe"] }
pollster = "1.0.1"
portable-pty = "0.9.0"
pkg-config = "0.3"
pretty_assertions = "1"
crossterm = "0.28.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
ratatui = "0.29.0"
regex = "1"
resvg = { version = "0.47", default-features = false }
schemars = "1.2.1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
signal-hook = "0.3"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
sys-locale = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
rustix = "1.1.4"
rmcp = { version = "=3.0.0-beta.3", default-features = false }
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.10"
strum = "0.27"
strum_macros = "0.27"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
typst = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-pdf = "=0.15.1"
tokio = "1"
thiserror = "2"
tempfile = "3"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
toml = "0.9"
tree-sitter = "0.26.11"
