[package]
name = "zeta-tui"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "zeta_tui"
path = "src/lib.rs"

[dependencies]
base64 = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
syntect = { workspace = true }
unicode-width = { workspace = true }
zeroize = { workspace = true }
zeta-ansi-escape = { workspace = true }
zeta-app-server-client = { workspace = true }
zeta-app-server-protocol = { workspace = true }
zeta-file-search = { workspace = true }
zeta-keybinding = { workspace = true }
zeta-diff = { workspace = true }
zeta-protocol = { workspace = true }
zeta-slash-commands = { workspace = true }
zeta-terminal-detection = { workspace = true }
zeta-utils-elapsed = { workspace = true }
zeta-utils-path = { workspace = true }
zeta-utils-image = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process", "stdio"] }
signal-hook = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { workspace = true }
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
zeta-client = { workspace = true }

[lints.rust]
# Keep unsafe code denied outside the explicitly scoped Windows console adapter.
unsafe_code = "deny"
