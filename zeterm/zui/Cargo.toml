[package]
name = "zui"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "zui"
path = "src/lib.rs"

[[bin]]
name = "zui-packager"
path = "tools/zui_packager.rs"
required-features = ["native"]

[[bin]]
name = "zui-appcontainer-runner"
path = "tools/zui_appcontainer_runner.rs"
required-features = ["native"]

[features]
default = ["wgpu"]
native = [
    "dep:accesskit",
    "dep:accesskit-platform",
    "dep:arboard",
    "dep:ashpd",
    "dep:base64",
    "dep:ed25519-dalek",
    "dep:futures",
    "dep:global-hotkey",
    "dep:gtk",
    "dep:muda",
    "dep:open",
    "dep:raw-window-handle",
    "dep:rfd",
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tray-icon",
    "dep:tokio",
    "dep:url",
    "dep:ureq",
    "dep:winit",
    "dep:windows-sys",
]
wgpu = [
    "native",
    "dep:bytemuck",
    "dep:glyphon",
    "dep:pollster",
    "dep:resvg",
    "dep:wgpu",
]

[dependencies]
accesskit = { workspace = true, optional = true }
accesskit-platform = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
cosmic-text = { workspace = true }
ed25519-dalek = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
global-hotkey = { workspace = true, optional = true }
glyphon = { workspace = true, optional = true }
open = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sys-locale = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
muda = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, optional = true, features = ["global_shortcuts", "tokio"] }
gtk = { workspace = true, optional = true }
muda = { workspace = true, optional = true, features = ["gtk"] }
tokio = { workspace = true, optional = true, features = ["macros", "rt", "sync"] }
tray-icon = { workspace = true, optional = true, features = ["gtk"] }

[lints.rust]
# Win32 AppContainer integration is isolated to modules that opt into unsafe code. The crate root
# denies unsafe code everywhere else.
unsafe_code = "allow"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[target.'cfg(unix)'.dev-dependencies]
ashpd = { workspace = true, features = ["global_shortcuts", "tokio"] }
