[package]
name = "zeterm"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
publish = false

[[bin]]
name = "zeterm"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
unicode-width = { workspace = true }
zeta-agent-sidebar = { workspace = true }
zeta-app-server-client = { workspace = true }
zeta-app-server-protocol = { workspace = true }
zeta-diff = { workspace = true }
zeta-editor = { workspace = true }
zeta-file-search = { workspace = true }
zeta-icons = { workspace = true }
zeta-install-context = { workspace = true }
zeta-input-classifier = { workspace = true }
zeta-keybinding = { workspace = true }
zeta-keybindings-host = { workspace = true }
zeta-layout = { workspace = true }
zeta-language-server-catalog = { workspace = true }
zeta-language-service = { workspace = true }
zeta-protocol = { workspace = true }
zeta-renderer = { workspace = true }
zeta-remote = { workspace = true }
zeta-remote-connections = { workspace = true }
zeta-settings = { workspace = true }
zeta-slash-commands = { workspace = true }
zeta-terminal = { workspace = true }
zeta-text-file = { workspace = true }
zeta-theme = { workspace = true }
zeta-commands = { workspace = true }
zeta-composer = { workspace = true }
zeta-ui = { workspace = true }
zeta-utils-path = { workspace = true }
zeta-utils-pty = { workspace = true }
zeta-wgpu = { workspace = true }
zeta-winit = { workspace = true }
zui = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
