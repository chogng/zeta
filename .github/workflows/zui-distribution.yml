name: ZUI desktop distribution

on:
  pull_request:
    paths:
      - ".github/workflows/zui-distribution.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "app/zui/**"
      - "app/zui-demo/**"
  push:
    branches: [main]
    tags: ["zui-v*"]
    paths:
      - ".github/workflows/zui-distribution.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "app/zui/**"
      - "app/zui-demo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-24.04
          - target: macos
            os: macos-15
          - target: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: .build/cargo
      RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/zui-v') }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.ZUI_MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.ZUI_MACOS_CERTIFICATE_PASSWORD }}
      MACOS_APPLICATION_IDENTITY: ${{ secrets.ZUI_MACOS_APPLICATION_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.ZUI_MACOS_INSTALLER_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.ZUI_MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.ZUI_MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.ZUI_MACOS_NOTARY_TEAM_ID }}
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.ZUI_WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.ZUI_WINDOWS_CERTIFICATE_PASSWORD }}
      LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.ZUI_LINUX_GPG_PRIVATE_KEY_BASE64 }}
      LINUX_GPG_KEY_ID: ${{ secrets.ZUI_LINUX_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        shell: bash
        run: rustup toolchain install stable --profile minimal

      - name: Install Linux desktop and packaging dependencies
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libfuse2 libgtk-3-dev libwayland-dev libx11-dev libxkbcommon-dev pkg-config
          curl --fail --location --retry 3 --output /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum --check
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Install WiX and locate SignTool
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          $SignTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $SignTool) { throw "SignTool was not found in the Windows SDK" }
          $SignTool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test public ZUI runtime
        shell: bash
        run: cargo +stable test --locked -p zui --no-default-features --features native --lib

      - name: Build framework consumer and packaging tools
        shell: bash
        run: cargo +stable build --locked --release -p zui-demo --features native --bin zui-native-demo -p zui --bin zui-packager --bin zui-appcontainer-runner

      - name: Create release manifest
        shell: bash
        env:
          ZUI_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          windows = os.environ["ZUI_TARGET"] == "windows"
          release = Path(os.environ["CARGO_TARGET_DIR"]) / "release"
          manifest = {
              "name": "ZuiDemo",
              "identifier": "dev.zeta.zui-demo",
              "version": "0.1.0",
              "executable": str(release / ("zui-native-demo.exe" if windows else "zui-native-demo")),
              "protocols": ["zui-demo"],
          }
          if windows:
              manifest["windows_appcontainer_runner"] = str(release / "zui-appcontainer-runner.exe")
          Path("zui-release-manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          PY

      - name: Import macOS signing identity and notary credentials
        if: matrix.target == 'macos' && env.RELEASE_SIGNING == 'true'
        shell: bash
        run: |
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "zui-signing.p12").write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"]))'
          KEYCHAIN="$RUNNER_TEMP/zui-signing.keychain-db"
          KEYCHAIN_PASSWORD="zui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/zui-signing.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          xcrun notarytool store-credentials zui-ci --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --keychain "$KEYCHAIN"
          {
            echo "ZUI_MACOS_APPLICATION_IDENTITY=$MACOS_APPLICATION_IDENTITY"
            echo "ZUI_MACOS_INSTALLER_IDENTITY=$MACOS_INSTALLER_IDENTITY"
            echo "ZUI_MACOS_NOTARY_PROFILE=zui-ci"
          } >> "$GITHUB_ENV"

      - name: Import Windows signing identity
        if: matrix.target == 'windows' && env.RELEASE_SIGNING == 'true'
        shell: pwsh
        run: |
          $Bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          $Pfx = Join-Path $env:RUNNER_TEMP "zui-signing.pfx"
          [IO.File]::WriteAllBytes($Pfx, $Bytes)
          $Password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $Certificate = Import-PfxCertificate -FilePath $Pfx -CertStoreLocation Cert:\CurrentUser\My -Password $Password
          if (-not $Certificate) { throw "Windows signing certificate import failed" }
          "ZUI_WINDOWS_CERTIFICATE_SHA1=$($Certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZUI_WINDOWS_TIMESTAMP_URL=https://timestamp.digicert.com" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import Linux signing identity
        if: matrix.target == 'linux' && env.RELEASE_SIGNING == 'true'
        shell: bash
        run: |
          printf '%s' "$LINUX_GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
          echo "ZUI_LINUX_GPG_KEY_ID=$LINUX_GPG_KEY_ID" >> "$GITHUB_ENV"

      - name: Build installer
        if: env.RELEASE_SIGNING != 'true'
        shell: bash
        run: >-
          "$CARGO_TARGET_DIR/release/zui-packager" installer zui-release-manifest.json dist "${{ matrix.target }}"

      - name: Build signed release
        if: env.RELEASE_SIGNING == 'true'
        shell: bash
        run: >-
          "$CARGO_TARGET_DIR/release/zui-packager" release zui-release-manifest.json dist "${{ matrix.target }}"

      - name: Collect release artifacts
        shell: bash
        env:
          ZUI_TARGET: ${{ matrix.target }}
        run: |
          mkdir release-artifacts
          if [[ "$ZUI_TARGET" == "macos" && "$RELEASE_SIGNING" == "true" ]]; then
            cp dist/*-signed.pkg release-artifacts/
          elif [[ "$ZUI_TARGET" == "macos" ]]; then
            cp dist/*.pkg release-artifacts/
          elif [[ "$ZUI_TARGET" == "linux" ]]; then
            cp dist/*.AppImage* release-artifacts/
          else
            cp dist/*.msi release-artifacts/
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zui-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish tagged ZUI release
    if: startsWith(github.ref, 'refs/tags/zui-v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download signed installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zui-*
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --generate-notes
