name: Rust warnings

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "scripts/cargo.py"
      - ".github/workflows/rust-warnings.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "scripts/cargo.py"
      - ".github/workflows/rust-warnings.yml"
  workflow_dispatch:

concurrency:
  group: rust-warnings-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warnings:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: python3
          - runner: macos-15
            python: python3
          - runner: windows-latest
            python: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            bubblewrap \
            libcap-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Reject Rust workspace warnings, including tests
        shell: bash
        run: ${{ matrix.python }} -B scripts/cargo.py --deny-warnings check --workspace --all-targets --locked
