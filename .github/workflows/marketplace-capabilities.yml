name: Marketplace capabilities

on:
  pull_request:
    paths:
      - ".github/workflows/marketplace-capabilities.yml"
      - "zeta-rs/app-server-protocol/src/protocol/extensions.rs"
      - "zeta-rs/app-server-protocol/src/protocol/marketplace.rs"
      - "zeta-rs/app-server-protocol/src/protocol/plugins.rs"
      - "zeta-rs/extensions/**"
      - "zeta-rs/marketplace-client/**"
      - "zeta-rs/marketplace-manager/**"
      - "zeta-rs/plugins/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/marketplace-capabilities.yml"
      - "zeta-rs/app-server-protocol/src/protocol/extensions.rs"
      - "zeta-rs/app-server-protocol/src/protocol/marketplace.rs"
      - "zeta-rs/app-server-protocol/src/protocol/plugins.rs"
      - "zeta-rs/extensions/**"
      - "zeta-rs/marketplace-client/**"
      - "zeta-rs/marketplace-manager/**"
      - "zeta-rs/plugins/**"

concurrency:
  group: marketplace-capabilities-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Test Marketplace capability crates
        run: cargo +stable test --locked -p zeta-plugins -p zeta-marketplace-client -p zeta-marketplace-manager -p zeta-extensions -p zeta-app-server-protocol
      - name: Lint Marketplace capability crates
        run: cargo +stable clippy --locked -p zeta-plugins -p zeta-marketplace-client -p zeta-marketplace-manager -p zeta-extensions -p zeta-app-server-protocol --all-targets --no-deps -- -D warnings
