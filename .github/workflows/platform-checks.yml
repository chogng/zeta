name: Platform checks

on:
  pull_request:
    paths:
      - ".github/workflows/platform-checks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Justfile"
      - "app/**"
      - "build/**"
      - "scripts/**"
      - "third_party/v8/**"
      - "zeta-code/**"
      - "zeta-rs/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform-checks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Justfile"
      - "app/**"
      - "build/**"
      - "scripts/**"
      - "third_party/v8/**"
      - "zeta-code/**"
      - "zeta-rs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            python: python3
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libcap-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            protobuf-compiler

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: brew install protobuf

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Check app target
        shell: bash
        run: ${{ matrix.python }} -B scripts/cargo.py check -p app --all-targets --target "${{ matrix.target }}"

      - name: Test platform packaging contracts
        shell: bash
        run: ${{ matrix.python }} -B scripts/cargo.py test -p zui --lib distribution::tests --target "${{ matrix.target }}"

      - name: Test Zeta Code tooling
        shell: bash
        run: ${{ matrix.python }} -B scripts/test-python.py zeta-code

      - name: Test build tooling
        shell: bash
        run: ${{ matrix.python }} -B scripts/test-python.py build

      - name: Test release tooling
        shell: bash
        run: ${{ matrix.python }} -B scripts/test-python.py release
