name: Platform checks

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.target }} (${{ matrix.runner }})
    permissions:
      contents: write
      id-token: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            python: python3
            archive: zip
            update_format: zip
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
            archive: zip
            update_format: zip
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
            archive: tar.gz
            update_format: tar-gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
            archive: tar.gz
            update_format: tar-gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
            archive: tar.gz
            update_format: tar-gz
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python: python
            archive: tar.gz
            update_format: tar-gz
            release_package: false
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            python: python
            archive: tar.gz
            update_format: tar-gz
            checks: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            bubblewrap \
            libcap-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Windows ARM64 Rust target
        if: runner.os == 'Windows' && matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Check app target
        if: matrix.checks != false
        shell: bash
        run: ${{ matrix.python }} -B scripts/cargo.py check -p app --all-targets --target "${{ matrix.target }}"

      - name: Test platform packaging contracts
        if: matrix.checks != false
        shell: bash
        run: ${{ matrix.python }} -B scripts/cargo.py test -p zui --lib distribution::tests --target "${{ matrix.target }}"

      - name: Test Zeta Code tooling
        if: matrix.checks != false
        shell: bash
        run: ${{ matrix.python }} -B scripts/test-python.py zeta-code

      - name: Test build tooling
        if: matrix.checks != false
        shell: bash
        run: ${{ matrix.python }} -B scripts/test-python.py build

      - name: Test release tooling
        if: matrix.checks != false
        shell: bash
        run: ${{ matrix.python }} -B scripts/test-python.py release

      - name: Test Linux managed network boundary
        if: matrix.checks != false && runner.os == 'Linux'
        shell: bash
        run: |
          ${{ matrix.python }} -B scripts/cargo.py build -p zeta-network-proxy --example probe --target "${{ matrix.target }}"
          export ZETA_NETWORK_PROBE="$GITHUB_WORKSPACE/.build/cargo/${{ matrix.target }}/debug/examples/probe"
          ${{ matrix.python }} -B scripts/cargo.py test -p zeta-mxc-sandbox --lib --target "${{ matrix.target }}"
          ${{ matrix.python }} -B scripts/cargo.py test -p zeta-mxc-sandbox --test linux --target "${{ matrix.target }}" -- --ignored

      - name: Test Windows MXC PSEC execution
        if: matrix.checks != false && runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ matrix.python }} -B scripts/cargo.py build -p zeta-network-proxy --example probe --locked --target "${{ matrix.target }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ZETA_NETWORK_PROBE = "$env:GITHUB_WORKSPACE/.build/cargo/${{ matrix.target }}/debug/examples/probe.exe"
          ${{ matrix.python }} -B scripts/cargo.py test -p zeta-mxc-sandbox --lib --target "${{ matrix.target }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ${{ matrix.python }} -B scripts/cargo.py test -p zeta-mxc-sandbox --test windows --target "${{ matrix.target }}" -- --include-ignored --test-threads=1
          exit $LASTEXITCODE

      - name: Build Zeta Code release package
        if: github.event_name == 'release' && matrix.release_package != false
        shell: bash
        env:
          ZETA_UPDATE_PUBLIC_KEY: ${{ vars.ZETA_UPDATE_PUBLIC_KEY }}
        run: |
          version="$(${{ matrix.python }} -c 'from build.release.zeta_package.version import read_workspace_version; from pathlib import Path; print(read_workspace_version(Path("Cargo.toml")))')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "${#ZETA_UPDATE_PUBLIC_KEY}" = 64
          ${{ matrix.python }} -B scripts/cargo.py build --package zeta-cli --bin zeta --profile release --target "${{ matrix.target }}"
          cli=".build/cargo/${{ matrix.target }}/release/zeta${{ runner.os == 'Windows' && '.exe' || '' }}"
          package=".build/releases/zeta-code-${{ matrix.target }}"
          ${{ matrix.python }} -B build/release/build_zeta_package.py \
            --target "${{ matrix.target }}" \
            --cli-bin "$cli" \
            --update-public-key "$ZETA_UPDATE_PUBLIC_KEY" \
            --package-dir "$package"
          ${{ matrix.python }} -B scripts/cargo.py build --package zeta-update-sign --bin zeta-update-sign

      - name: Import macOS release credentials
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'macOS'
        shell: bash
        env:
          ZETA_MACOS_CERTIFICATE_P12: ${{ secrets.ZETA_MACOS_CERTIFICATE_P12 }}
          ZETA_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.ZETA_MACOS_CERTIFICATE_PASSWORD }}
          ZETA_MACOS_NOTARY_KEY_P8: ${{ secrets.ZETA_MACOS_NOTARY_KEY_P8 }}
          ZETA_MACOS_NOTARY_KEY_ID: ${{ secrets.ZETA_MACOS_NOTARY_KEY_ID }}
          ZETA_MACOS_NOTARY_ISSUER: ${{ secrets.ZETA_MACOS_NOTARY_ISSUER }}
        run: |
          test -n "$ZETA_MACOS_CERTIFICATE_P12"
          test -n "$ZETA_MACOS_CERTIFICATE_PASSWORD"
          test -n "$ZETA_MACOS_NOTARY_KEY_P8"
          test -n "$ZETA_MACOS_NOTARY_KEY_ID"
          test -n "$ZETA_MACOS_NOTARY_ISSUER"
          signing_dir="$RUNNER_TEMP/zeta-signing"
          mkdir -p "$signing_dir"
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "zeta-signing", "certificate.p12").write_bytes(base64.b64decode(os.environ["ZETA_MACOS_CERTIFICATE_P12"], validate=True)); pathlib.Path(os.environ["RUNNER_TEMP"], "zeta-signing", "AuthKey.p8").write_bytes(base64.b64decode(os.environ["ZETA_MACOS_NOTARY_KEY_P8"], validate=True))'
          keychain="$signing_dir/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" -P "$ZETA_MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          login_keychain="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "$login_keychain"
          xcrun notarytool store-credentials zeta-release \
            --key "$signing_dir/AuthKey.p8" \
            --key-id "$ZETA_MACOS_NOTARY_KEY_ID" \
            --issuer "$ZETA_MACOS_NOTARY_ISSUER"
          echo "ZETA_MACOS_NOTARY_PROFILE=zeta-release" >> "$GITHUB_ENV"

      - name: Sign in to Azure for Windows release signing
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'Windows'
        uses: Azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3.0.0
        with:
          client-id: ${{ vars.ZETA_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.ZETA_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.ZETA_AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executables with Artifact Signing
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'Windows'
        uses: Azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.ZETA_WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ZETA_WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ZETA_WINDOWS_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\.build\releases\zeta-code-${{ matrix.target }}
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Apply system signatures
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'macOS'
        shell: bash
        env:
          ZETA_MACOS_SIGNING_IDENTITY: ${{ vars.ZETA_MACOS_SIGNING_IDENTITY }}
        run: |
          ${{ matrix.python }} -B build/release/sign_zeta_package.py \
            --package-dir ".build/releases/zeta-code-${{ matrix.target }}" \
            --target "${{ matrix.target }}"

      - name: Verify and record Windows signatures
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'Windows'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signTool) { throw "signtool.exe is not installed" }
          $env:ZETA_WINDOWS_SIGNTOOL = $signTool.FullName
          ${{ matrix.python }} -B build/release/sign_zeta_package.py `
            --package-dir ".build/releases/zeta-code-${{ matrix.target }}" `
            --target "${{ matrix.target }}" `
            --verify-only

      - name: Build Zeta Code release archive
        if: github.event_name == 'release' && matrix.release_package != false
        shell: bash
        run: |
          ${{ matrix.python }} -B build/release/build_zeta_code_archive.py \
            --package-dir ".build/releases/zeta-code-${{ matrix.target }}" \
            --output ".build/releases/zeta-code-${{ matrix.target }}.${{ matrix.archive }}"

      - name: Notarize macOS release archive
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'macOS'
        shell: bash
        run: |
          ${{ matrix.python }} -B build/release/notarize_release.py \
            ".build/releases/zeta-code-${{ matrix.target }}.${{ matrix.archive }}"

      - name: Sign Zeta Code update
        if: github.event_name == 'release' && matrix.release_package != false
        shell: bash
        env:
          ZETA_UPDATE_PUBLIC_KEY: ${{ vars.ZETA_UPDATE_PUBLIC_KEY }}
          ZETA_UPDATE_SIGNING_KEY: ${{ secrets.ZETA_UPDATE_SIGNING_KEY }}
        run: |
          signer=".build/cargo/debug/zeta-update-sign${{ runner.os == 'Windows' && '.exe' || '' }}"
          "$signer" \
            --repository chogng/zeta \
            --product zeta-code \
            --channel latest \
            --version "${GITHUB_REF_NAME#v}" \
            --release-tag "$GITHUB_REF_NAME" \
            --target "${{ matrix.target }}" \
            --format "${{ matrix.update_format }}" \
            --archive ".build/releases/zeta-code-${{ matrix.target }}.${{ matrix.archive }}" \
            --output ".build/releases/zeta-code-${{ matrix.target }}.update.json" \
            --public-key "$ZETA_UPDATE_PUBLIC_KEY"

      - name: Publish Zeta Code release package
        if: github.event_name == 'release' && matrix.release_package != false
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            ".build/releases/zeta-code-${{ matrix.target }}.${{ matrix.archive }}" \
            ".build/releases/zeta-code-${{ matrix.target }}.${{ matrix.archive }}.sha256" \
            ".build/releases/zeta-code-${{ matrix.target }}.update.json"
