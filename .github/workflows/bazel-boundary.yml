name: Bazel app boundary

on:
  pull_request:
    paths:
      - ".github/workflows/bazel-boundary.yml"
      - ".bazelrc"
      - ".bazelversion"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.lock"
      - "Cargo.toml"
      - "app/**"
      - "bazel/**"
      - "build/release/**"
      - "third_party/rules_rs/**"
      - "zeta-rs/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bazel-boundary.yml"
      - ".bazelrc"
      - ".bazelversion"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "Cargo.lock"
      - "Cargo.toml"
      - "app/**"
      - "bazel/**"
      - "build/release/**"
      - "third_party/rules_rs/**"
      - "zeta-rs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: bazel-app-boundary
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Test app boundary contract
        run: bazel test //app:app_ci --test_output=errors
