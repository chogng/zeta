name: 工程任务
description: 描述重构、架构、兼容性、文档或验证任务
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        请说明要达成的工程结果和边界。实现者会结合仓库约束确认责任归属、改动位置和验证方式。

  - type: textarea
    id: goal
    attributes:
      label: 任务目标
      description: 完成后仓库或用户获得什么明确结果？
      placeholder: 例如：让……由……负责，并使……行为保持不变。
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: 目标范围
      description: 填写产品、crate、目录、协议或文档区域。
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: 当前状态
      description: 当前实现、限制、已知问题或需要保留的兼容行为。
    validations:
      required: true

  - type: textarea
    id: target_state
    attributes:
      label: 目标状态与边界
      description: 描述长期责任归属、依赖方向、接口或行为边界；不要把猜测的文件路径当成要求。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 写出可验证的完成条件，一行一个 AC。
      placeholder: |
        - AC-1：……
        - AC-2：……
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 验证要求
      description: 指定需要运行的行为验证、构建、测试或文档检查；未确定的部分由实现者补齐。
    validations:
      required: true

  - type: input
    id: references
    attributes:
      label: 相关链接
      description: 可填写现有文档、Issue、设计讨论或上游参考。
