name: Bug 报告
description: 报告一个可以复现的问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        请描述用户实际遇到的问题，不必提前指定实现方案。能复现的问题请附上最小复现步骤。

  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 谁在什么场景下遇到了什么问题？
      placeholder: 例如：在……场景下，用户无法……
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: 影响范围
      description: 填写产品、模块、命令或页面；不确定时写出你知道的入口即可。
      placeholder: 例如：Workbench Sessions / zeta-code / 设置页面
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从干净状态开始，按顺序写出可以复现问题的操作。
      placeholder: |
        1. ……
        2. ……
        3. ……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 修复后用户应该看到什么结果？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 当前发生了什么？请附错误信息、日志或终端输出（如有）。
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: 是否回归
      options:
        - 不确定
        - 是，之前可以正常工作
        - 否，从未正常工作或没有历史版本可对比
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 写出修复完成后如何确认问题已经解决；一行一个 AC。
      placeholder: |
        - AC-1：按上述步骤操作后，……
        - AC-2：……场景仍然……
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可填写版本、平台、相关 Issue、文档、截图或日志。
      render: text
